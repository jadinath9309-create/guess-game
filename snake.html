<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #080b18;

    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 94%;
    max-width: 430px;

    text-align: center;
}

h1 {
    margin-bottom: 5px;
    font-size: 34px;
}

.subtitle {
    color: #9da6c7;
    margin-top: 0;
}

.scoreBox {
    display: flex;
    justify-content: space-between;

    background: #151b32;

    padding: 14px 20px;

    border-radius: 15px;

    margin: 18px 0;
}

.scoreBox span {
    color: #9da6c7;
}

.scoreBox b {
    font-size: 20px;
}

canvas {
    width: 100%;
    max-width: 400px;

    aspect-ratio: 1 / 1;

    background: #111827;

    border: 4px solid #303b63;

    border-radius: 15px;

    display: block;

    margin: auto;

    touch-action: none;
}

.controls {
    margin: 20px auto;

    width: 210px;

    display: grid;

    grid-template-columns: repeat(3, 65px);

    grid-template-rows: repeat(2, 65px);

    gap: 8px;

    justify-content: center;
}

.controls button {
    border: none;

    border-radius: 14px;

    background: #202945;

    color: white;

    font-size: 25px;

    font-weight: bold;

    cursor: pointer;
}

.controls button:active {
    transform: scale(0.9);
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.actions {
    display: flex;

    gap: 10px;
}

.actions button {
    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 13px;

    background: #5d7cff;

    color: white;

    font-size: 16px;

    font-weight: bold;
}

.home {
    background: #202945 !important;
}

.message {
    min-height: 25px;

    margin: 10px;

    font-weight: bold;
}

</style>

</head>

<body>

<div class="game">

<h1>🐍 SNAKE</h1>

<p class="subtitle">
Eat the apples and grow!
</p>

<div class="scoreBox">

<div>
<span>SCORE</span><br>
<b id="score">0</b>
</div>

<div>
<span>BEST</span><br>
<b id="best">0</b>
</div>

</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="message" id="message">
Use the buttons to move!
</div>

<div class="controls">

<button class="up" onclick="changeDirection('up')">
⬆️
</button>

<button class="left" onclick="changeDirection('left')">
⬅️
</button>

<button class="down" onclick="changeDirection('down')">
⬇️
</button>

<button class="right" onclick="changeDirection('right')">
➡️
</button>

</div>

<div class="actions">

<button onclick="restartGame()">
🔄 RESTART
</button>

<button class="home"
onclick="location.href='index.html'">
🏠 HOME
</button>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const grid = 20;

const tileCount =
canvas.width / grid;

let snake;

let apple;

let direction;

let nextDirection;

let score = 0;

let gameOver = false;

let gameLoop;

let best =
Number(localStorage.getItem("snakeBest")) || 0;

document.getElementById("best")
.innerText = best;


function startGame() {

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "right";

    nextDirection = "right";

    score = 0;

    gameOver = false;

    document.getElementById("score")
    .innerText = score;

    document.getElementById("message")
    .innerText =
    "Eat 🍎 and grow!";

    createApple();

    clearInterval(gameLoop);

    gameLoop =
    setInterval(update, 120);

    draw();

}


function createApple() {

    do {

        apple = {

            x: Math.floor(
                Math.random() * tileCount
            ),

            y: Math.floor(
                Math.random() * tileCount
            )

        };

    } while (
        snake.some(
            part =>
            part.x === apple.x &&
            part.y === apple.y
        )
    );

}


function update() {

    if (gameOver) return;

    direction = nextDirection;

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction === "up")
        head.y--;

    if (direction === "down")
        head.y++;

    if (direction === "left")
        head.x--;

    if (direction === "right")
        head.x++;


    // Wall collision

    if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ) {

        endGame();

        return;

    }


    // Self collision

    if (
        snake.some(
            part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    // Apple

    if (
        head.x === apple.x &&
        head.y === apple.y
    ) {

        score++;

        document.getElementById("score")
        .innerText = score;


        if (score > best) {

            best = score;

            localStorage.setItem(
                "snakeBest",
                best
            );

            document.getElementById("best")
            .innerText = best;

        }

        createApple();

    } else {

        snake.pop();

    }

    draw();

}


function draw() {

    // Background

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Grid

    ctx.strokeStyle =
    "rgba(255,255,255,0.04)";

    for (
        let i = 0;
        i <= canvas.width;
        i += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(i, 0);

        ctx.lineTo(i, canvas.height);

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0, i);

        ctx.lineTo(canvas.width, i);

        ctx.stroke();

    }


    // Apple

    ctx.font = "18px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.fillText(
        "🍎",
        apple.x * grid + grid / 2,
        apple.y * grid + grid / 2
    );


    // Snake

    snake.forEach(
        (part, index) => {

            ctx.fillStyle =
            index === 0
            ? "#6f8cff"
            : "#4d68c9";

            ctx.fillRect(
                part.x * grid + 1,
                part.y * grid + 1,
                grid - 2,
                grid - 2
            );

        }
    );

}


function changeDirection(newDirection) {

    if (gameOver) return;


    if (
        newDirection === "up" &&
        direction !== "down"
    )
        nextDirection = "up";


    if (
        newDirection === "down" &&
        direction !== "up"
    )
        nextDirection = "down";


    if (
        newDirection === "left" &&
        direction !== "right"
    )
        nextDirection = "left";


    if (
        newDirection === "right" &&
        direction !== "left"
    )
        nextDirection = "right";

}


// Keyboard controls

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ) {

            changeDirection("up");

        }

        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {

            changeDirection("down");

        }

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            changeDirection("left");

        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            changeDirection("right");

        }

    }
);


function endGame() {

    gameOver = true;

    clearInterval(gameLoop);

    document.getElementById("message")
    .innerText =
    "💥 GAME OVER! Score: " + score;

}


function restartGame() {

    startGame();

}

startGame();

</script>

</body>
</html>
