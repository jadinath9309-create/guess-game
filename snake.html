<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #263b80, transparent 45%),
        #080b18;

    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 94%;
    max-width: 460px;

    text-align: center;
}

h1 {
    margin: 15px 0 5px;

    font-size: 36px;
}

.subtitle {
    color: #aeb7d9;

    margin-top: 0;
}


/* Difficulty */

.sectionTitle {
    text-align: left;

    margin: 15px 0 8px;

    color: #aeb7d9;

    font-size: 13px;

    font-weight: bold;
}

.modes {
    display: flex;

    gap: 8px;
}

.mode {
    flex: 1;

    padding: 12px 5px;

    border: none;

    border-radius: 12px;

    background: #171e36;

    color: #aeb7d9;

    font-weight: bold;

    cursor: pointer;
}

.mode.active {
    background: #5d7cff;

    color: white;
}


/* Control mode */

.controlModes {
    display: flex;

    gap: 8px;
}

.control {
    flex: 1;

    padding: 12px;

    border: none;

    border-radius: 12px;

    background: #171e36;

    color: #aeb7d9;

    font-weight: bold;

    cursor: pointer;
}

.control.active {
    background: #5d7cff;

    color: white;
}


/* Score */

.scoreBox {
    display: flex;

    justify-content: space-between;

    background: #151b32;

    padding: 13px 20px;

    border-radius: 15px;

    margin: 15px 0;
}

.scoreBox span {
    color: #9da6c7;

    font-size: 13px;
}

.scoreBox b {
    font-size: 21px;
}


/* Game */

.canvasWrap {
    position: relative;

    width: 100%;

    max-width: 440px;

    margin: auto;
}

canvas {
    width: 100%;

    aspect-ratio: 1 / 1;

    background: #111827;

    border: 4px solid #303b63;

    border-radius: 15px;

    display: block;

    touch-action: none;
}


/* Swipe hint */

.swipeHint {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: rgba(255,255,255,0.45);

    font-size: 15px;

    pointer-events: none;

    transition: opacity 0.3s;
}


/* Message */

.message {
    min-height: 25px;

    margin: 12px;

    font-weight: bold;
}


/* Controls */

.controls {
    margin: 18px auto;

    width: 270px;

    display: grid;

    grid-template-columns:
    repeat(3, 82px);

    grid-template-rows:
    repeat(2, 70px);

    gap: 8px;

    justify-content: center;
}

.controls button {
    border: none;

    border-radius: 17px;

    background: #202945;

    color: white;

    font-size: 30px;

    cursor: pointer;

    touch-action: manipulation;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.3);
}

.controls button:active {
    transform: scale(0.91);

    background: #303b63;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;

    grid-row: 2;
}

.down {
    grid-column: 2;

    grid-row: 2;
}

.right {
    grid-column: 3;

    grid-row: 2;
}


/* Bottom */

.actions {
    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}

.actions button {
    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 13px;

    background: #5d7cff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.actions .home {
    background: #202945;
}


/* Hide buttons in swipe mode */

.swipeMode .controls {
    display: none;
}

</style>

</head>

<body>

<div class="game" id="gameContainer">


<h1>🐍 SNAKE</h1>

<p class="subtitle">
Eat apples • Grow • Beat your score
</p>


<!-- Difficulty -->

<div class="sectionTitle">
DIFFICULTY
</div>

<div class="modes">

<button class="mode active"
onclick="setDifficulty('easy', this)">
🟢 EASY
</button>

<button class="mode"
onclick="setDifficulty('normal', this)">
🟡 NORMAL
</button>

<button class="mode"
onclick="setDifficulty('hard', this)">
🔴 HARD
</button>

</div>


<!-- Control mode -->

<div class="sectionTitle">
CONTROLS
</div>

<div class="controlModes">

<button class="control active"
onclick="setControl('buttons', this)">
🎮 BUTTONS
</button>

<button class="control"
onclick="setControl('swipe', this)">
👆 SWIPE
</button>

</div>


<!-- Score -->

<div class="scoreBox">

<div>
<span>SCORE</span>
<br>
<b id="score">0</b>
</div>

<div>
<span>BEST</span>
<br>
<b id="best">0</b>
</div>

</div>


<!-- Game -->

<div class="canvasWrap" id="canvasWrap">

<canvas
id="game"
width="440"
height="440">
</canvas>

<div
class="swipeHint"
id="swipeHint">

SWIPE TO MOVE

</div>

</div>


<div class="message" id="message">
Choose a direction!
</div>


<!-- Big buttons -->

<div class="controls">

<button class="up"
onclick="changeDirection('up')">
⬆️
</button>

<button class="left"
onclick="changeDirection('left')">
⬅️
</button>

<button class="down"
onclick="changeDirection('down')">
⬇️
</button>

<button class="right"
onclick="changeDirection('right')">
➡️
</button>

</div>


<div class="actions">

<button onclick="restartGame()">
🔄 RESTART
</button>

<button
class="home"
onclick="location.href='index.html'">

🏠 HOME

</button>

</div>


</div>


<script>


const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


/*
   22 × 22 map
*/

const grid = 20;

const tileCount = 22;


let snake = [];

let apple = {};

let direction = "right";

let nextDirection = "right";

let score = 0;

let gameOver = false;

let gameLoop;


/* Difficulty */

const speeds = {

    easy: 180,

    normal: 130,

    hard: 90

};

let difficulty = "easy";


/* Control */

let controlMode = "buttons";


/* Best */

let best =
Number(
localStorage.getItem("snakeBest")
) || 0;

document.getElementById("best")
.innerText = best;


/* Difficulty */

function setDifficulty(mode, button) {

    difficulty = mode;

    document
    .querySelectorAll(".mode")
    .forEach(
        b =>
        b.classList.remove("active")
    );

    button.classList.add("active");

    restartGame();

}


/* Control */

function setControl(mode, button) {

    controlMode = mode;

    document
    .querySelectorAll(".control")
    .forEach(
        b =>
        b.classList.remove("active")
    );

    button.classList.add("active");


    const container =
    document.getElementById(
        "gameContainer"
    );

    if (mode === "swipe") {

        container.classList.add(
            "swipeMode"
        );

        document.getElementById(
            "swipeHint"
        ).style.opacity = "1";

        document.getElementById(
            "message"
        ).innerText =
        "Swipe in any direction!";

    } else {

        container.classList.remove(
            "swipeMode"
        );

        document.getElementById(
            "swipeHint"
        ).style.opacity = "0";

        document.getElementById(
            "message"
        ).innerText =
        "Use the buttons to move!";

    }

}


/* Start */

function startGame() {

    snake = [

        {x: 11, y: 11},

        {x: 10, y: 11},

        {x: 9, y: 11}

    ];


    direction = "right";

    nextDirection = "right";

    score = 0;

    gameOver = false;


    document.getElementById(
        "score"
    ).innerText = score;


    createApple();


    clearInterval(gameLoop);


    gameLoop =
    setInterval(

        update,

        speeds[difficulty]

    );


    draw();

}


/* Apple */

function createApple() {

    do {

        apple = {

            x:
            Math.floor(
                Math.random() *
                tileCount
            ),

            y:
            Math.floor(
                Math.random() *
                tileCount
            )

        };

    } while (

        snake.some(

            part =>

            part.x === apple.x &&

            part.y === apple.y

        )

    );

}


/* Update */

function update() {

    if (gameOver)
        return;


    direction =
    nextDirection;


    let head = {

        x: snake[0].x,

        y: snake[0].y

    };


    if (direction === "up")
        head.y--;

    if (direction === "down")
        head.y++;

    if (direction === "left")
        head.x--;

    if (direction === "right")
        head.x++;


    /* Wall collision */

    if (

        head.x < 0 ||

        head.x >= tileCount ||

        head.y < 0 ||

        head.y >= tileCount

    ) {

        endGame();

        return;

    }


    /* Self collision */

    if (

        snake.some(

            part =>

            part.x === head.x &&

            part.y === head.y

        )

    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* Apple */

    if (

        head.x === apple.x &&

        head.y === apple.y

    ) {

        score++;


        document.getElementById(
            "score"
        ).innerText = score;


        if (score > best) {

            best = score;


            localStorage.setItem(
                "snakeBest",
                best
            );


            document.getElementById(
                "best"
            ).innerText = best;

        }


        createApple();

    }

    else {

        snake.pop();

    }


    draw();

}


/* Draw */

function draw() {

    ctx.fillStyle =
    "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Grid */

    ctx.strokeStyle =
    "rgba(255,255,255,0.035)";


    for (

        let i = 0;

        i <= canvas.width;

        i += grid

    ) {

        ctx.beginPath();

        ctx.moveTo(i, 0);

        ctx.lineTo(
            i,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0, i);

        ctx.lineTo(
            canvas.width,
            i
        );

        ctx.stroke();

    }


    /* Apple */

    ctx.font =
    "18px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";


    ctx.fillText(

        "🍎",

        apple.x * grid +
        grid / 2,

        apple.y * grid +
        grid / 2

    );


    /* Snake */

    snake.forEach(

        (part, index) => {

            ctx.fillStyle =

            index === 0

            ? "#7189ff"

            : "#5069cf";


            ctx.fillRect(

                part.x * grid + 1,

                part.y * grid + 1,

                grid - 2,

                grid - 2

            );

        }

    );

}


/* Direction */

function changeDirection(
    newDirection
) {

    if (gameOver)
        return;


    if (

        newDirection === "up" &&

        direction !== "down"

    )

        nextDirection =
        "up";


    if (

        newDirection === "down" &&

        direction !== "up"

    )

        nextDirection =
        "down";


    if (

        newDirection === "left" &&

        direction !== "right"

    )

        nextDirection =
        "left";


    if (

        newDirection === "right" &&

        direction !== "left"

    )

        nextDirection =
        "right";

}


/* Keyboard */

document.addEventListener(
    "keydown",
    function(event) {

        if (

            event.key === "ArrowUp" ||

            event.key.toLowerCase()
            === "w"

        )

            changeDirection("up");


        if (

            event.key === "ArrowDown" ||

            event.key.toLowerCase()
            === "s"

        )

            changeDirection("down");


        if (

            event.key === "ArrowLeft" ||

            event.key.toLowerCase()
            === "a"

        )

            changeDirection("left");


        if (

            event.key === "ArrowRight" ||

            event.key.toLowerCase()
            === "d"

        )

            changeDirection("right");

    }
);


/* Swipe */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(
    "touchstart",
    function(event) {

        const touch =
        event.changedTouches[0];

        touchStartX =
        touch.clientX;

        touchStartY =
        touch.clientY;

    },
    {passive: true}
);


canvas.addEventListener(
    "touchend",
    function(event) {

        if (
            controlMode !== "swipe"
        )
            return;


        const touch =
        event.changedTouches[0];


        const dx =
        touch.clientX -
        touchStartX;


        const dy =
        touch.clientY -
        touchStartY;


        const minSwipe = 25;


        if (

            Math.abs(dx) <
            minSwipe &&

            Math.abs(dy) <
            minSwipe

        )

            return;


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0)

                changeDirection(
                    "right"
                );

            else

                changeDirection(
                    "left"
                );

        } else {

            if (dy > 0)

                changeDirection(
                    "down"
                );

            else

                changeDirection(
                    "up"
                );

        }


        document.getElementById(
            "swipeHint"
        ).style.opacity = "0";

    },
    {passive: true}
);


/* Game over */

function endGame() {

    gameOver = true;

    clearInterval(gameLoop);


    document.getElementById(
        "message"
    ).innerText =

    "💥 GAME OVER! Score: "
    + score;

}


/* Restart */

function restartGame() {

    startGame();

}


startGame();

</script>

</body>
</html>
