<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guess Master</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #263b80, transparent 45%),
        linear-gradient(135deg, #080b18, #11162b);

    color: white;
}

.game {
    width: 90%;
    max-width: 400px;
    padding: 28px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;

    text-align: center;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);

    backdrop-filter: blur(15px);
}

.title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitle {
    color: #aeb7d9;
    margin-bottom: 25px;
}

.number {
    font-size: 65px;
    font-weight: bold;

    margin: 15px;

    letter-spacing: 5px;
}

.info {
    display: flex;
    justify-content: space-around;

    margin: 20px 0;
}

.box {
    background: rgba(255,255,255,0.08);

    padding: 12px 20px;

    border-radius: 15px;
}

.box span {
    display: block;

    font-size: 13px;

    color: #aeb7d9;
}

.box b {
    font-size: 22px;
}

input {
    width: 100%;

    padding: 17px;

    border: none;
    outline: none;

    border-radius: 14px;

    text-align: center;

    font-size: 22px;

    background: #0b1022;

    color: white;

    margin-bottom: 12px;
}

button {
    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 14px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 8px;
}

.guess {
    background: #5d7cff;

    color: white;
}

.new {
    background: rgba(255,255,255,0.1);

    color: white;
}

button:active {
    transform: scale(0.96);
}

#message {
    min-height: 30px;

    margin: 18px 0;

    font-size: 18px;

    font-weight: bold;
}

.win {
    animation: pop 0.4s;
}

@keyframes pop {

    0% {
        transform: scale(0.8);
    }

    100% {
        transform: scale(1);
    }

}

</style>
</head>

<body>

<div class="game">

<div class="title">
🎯 GUESS MASTER
</div>

<div class="subtitle">
Guess the secret number!
</div>

<div class="number">
?
</div>

<p>
I'm thinking of a number between <b>1 - 100</b>
</p>

<div class="info">

<div class="box">
<span>ATTEMPTS</span>
<b id="attempts">0</b>
</div>

<div class="box">
<span>BEST</span>
<b id="best">-</b>
</div>

</div>

<input
id="guess"
type="number"
min="1"
max="100"
placeholder="Enter your guess"
>

<button class="guess" onclick="checkGuess()">
🎯 GUESS
</button>

<div id="message">
Make your first guess!
</div>

<button class="new" onclick="newGame()">
🔄 NEW GAME
</button>

</div>

<script>

let secret;
let attempts = 0;

let best = localStorage.getItem("best");

if (best) {

    document.getElementById("best").innerText = best;

}

function newGame() {

    secret = Math.floor(Math.random() * 100) + 1;

    attempts = 0;

    document.getElementById("attempts").innerText = "0";

    document.getElementById("message").innerText =
        "Make your first guess!";

    document.getElementById("message").className = "";

    document.getElementById("guess").value = "";

}

function checkGuess() {

    let input = document.getElementById("guess");

    let guess = Number(input.value);

    let message = document.getElementById("message");

    if (!guess || guess < 1 || guess > 100) {

        message.innerText =
            "⚠️ Enter a number from 1 to 100";

        return;

    }

    attempts++;

    document.getElementById("attempts").innerText =
        attempts;

    if (guess === secret) {

        message.innerText =
            "🏆 CORRECT! You won!";

        message.className = "win";

        if (!best || attempts < Number(best)) {

            best = attempts;

            localStorage.setItem("best", best);

            document.getElementById("best").innerText =
                best;

        }

    }

    else if (guess < secret) {

        message.innerText =
            "⬆️ Too low! Try a bigger number.";

    }

    else {

        message.innerText =
            "⬇️ Too high! Try a smaller number.";

    }

    input.value = "";

    input.focus();

}

document.getElementById("guess").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            checkGuess();

        }

    }
);

newGame();

</script>

</body>
</html>
