<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>3D Runner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;

    background:#07101f;

    font-family:Arial,sans-serif;

    color:white;

    touch-action:none;
}

canvas{
    display:block;
}

#ui{
    position:fixed;

    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;

    z-index:5;
}

.box{
    background:rgba(0,0,0,.45);

    padding:10px 15px;

    border-radius:13px;

    backdrop-filter:blur(8px);

    font-weight:bold;
}

#start{
    position:fixed;

    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(5,10,25,.75),
        rgba(5,10,25,.9)
    );

    z-index:10;

    text-align:center;
}

#start h1{
    font-size:48px;

    margin:0 0 8px;
}

#start p{
    color:#aeb7d9;

    margin-bottom:25px;
}

button{
    border:none;

    border-radius:15px;

    padding:15px 35px;

    background:#5d7cff;

    color:white;

    font-size:18px;

    font-weight:bold;
}

#gameOver{
    position:fixed;

    inset:0;

    display:none;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:rgba(5,10,25,.82);

    z-index:10;

    text-align:center;
}

#gameOver h1{
    font-size:42px;
}

#gameOver p{
    color:#aeb7d9;
}

.hint{
    position:fixed;

    bottom:20px;

    left:0;
    right:0;

    text-align:center;

    color:rgba(255,255,255,.55);

    font-size:14px;

    pointer-events:none;
}

</style>

</head>

<body>


<div id="ui">

<div class="box">
🏆 SCORE:
<span id="score">0</span>
</div>

<div class="box">
🪙 COINS:
<span id="coins">0</span>
</div>

</div>


<div id="start">

<h1>🏃 3D RUNNER</h1>

<p>
Swipe left/right to move<br>
Swipe up to jump
</p>

<button onclick="startGame()">
▶ PLAY
</button>

</div>


<div id="gameOver">

<h1>💥 GAME OVER</h1>

<p>
Score:
<b id="finalScore">0</b>
</p>

<button onclick="startGame()">
🔄 PLAY AGAIN
</button>

<br>

<button
onclick="location.href='index.html'"
style="background:#202945">

🏠 HOME

</button>

</div>


<div class="hint">
👆 SWIPE TO MOVE • AVOID OBSTACLES • COLLECT COINS
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>


/* =========================
   THREE.JS SETUP
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x07101f);

scene.fog =
new THREE.Fog(
    0x07101f,
    20,
    75
);


const camera =
new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    .1,
    200
);

camera.position.set(
    0,
    4,
    8
);

camera.lookAt(
    0,
    1,
    -10
);


const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

document.body.appendChild(
    renderer.domElement
);


/* =========================
   LIGHT
========================= */

const ambient =
new THREE.AmbientLight(
    0xffffff,
    .8
);

scene.add(ambient);


const light =
new THREE.DirectionalLight(
    0xffffff,
    1
);

light.position.set(
    5,
    10,
    5
);

scene.add(light);


/* =========================
   ROAD
========================= */

const road =
new THREE.Mesh(

    new THREE.BoxGeometry(
        12,
        .2,
        200
    ),

    new THREE.MeshStandardMaterial({
        color:0x242b3d
    })

);

road.position.set(
    0,
    -.1,
    -70
);

scene.add(road);


/* Road lines */

const lines=[];

for(
    let z=-5;
    z>-190;
    z-=6
){

    for(
        let x=-2;
        x<=2;
        x+=4
    ){

        const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .12,
                .03,
                2
            ),

            new THREE.MeshBasicMaterial({
                color:0x8992a8
            })

        );

        line.position.set(
            x,
            .02,
            z
        );

        scene.add(line);

        lines.push(line);

    }

}


/* =========================
   PLAYER
========================= */

const player =
new THREE.Group();


const body =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .8,
        1.3,
        .7
    ),

    new THREE.MeshStandardMaterial({
        color:0x5d7cff
    })

);

body.position.y=.8;

player.add(body);


const head =
new THREE.Mesh(

    new THREE.SphereGeometry(
        .42,
        16,
        16
    ),

    new THREE.MeshStandardMaterial({
        color:0xffd2a6
    })

);

head.position.y=1.7;

player.add(head);


player.position.set(
    0,
    0,
    2
);

scene.add(player);


/* =========================
   VARIABLES
========================= */

let lane=0;

const lanes=[
    -3,
    0,
    3
];

let velocityY=0;

let jumping=false;

let speed=.32;

let score=0;

let coinCount=0;

let running=false;

let obstacles=[];

let coins=[];


/* =========================
   START
========================= */

function startGame(){

    obstacles.forEach(
        o=>scene.remove(o)
    );

    coins.forEach(
        c=>scene.remove(c)
    );

    obstacles=[];

    coins=[];

    lane=0;

    player.position.x=0;

    player.position.y=0;

    velocityY=0;

    jumping=false;

    speed=.32;

    score=0;

    coinCount=0;

    document.getElementById(
        "score"
    ).innerText=0;

    document.getElementById(
        "coins"
    ).innerText=0;

    document.getElementById(
        "start"
    ).style.display="none";

    document.getElementById(
        "gameOver"
    ).style.display="none";

    running=true;

}


/* =========================
   OBSTACLE
========================= */

function createObstacle(){

    const obstacle =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.4,
            1.5,
            1.2
        ),

        new THREE.MeshStandardMaterial({
            color:0xe94b5f
        })

    );

    const randomLane =
    Math.floor(
        Math.random()*3
    );

    obstacle.position.set(
        lanes[randomLane],
        .75,
        -75
    );

    scene.add(obstacle);

    obstacles.push(
        obstacle
    );

}


/* =========================
   COIN
========================= */

function createCoin(){

    const coin =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .35,
            .35,
            .12,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0xffd83d
        })

    );

    const randomLane =
    Math.floor(
        Math.random()*3
    );

    coin.position.set(
        lanes[randomLane],
        1.2,
        -75
    );

    coin.rotation.x=
    Math.PI/2;

    scene.add(coin);

    coins.push(
        coin
    );

}


/* =========================
   MOVE
========================= */

function moveLeft(){

    if(!running)
        return;

    lane--;

    if(lane<0)
        lane=0;

}


function moveRight(){

    if(!running)
        return;

    lane++;

    if(lane>2)
        lane=2;

}


function jump(){

    if(
        !running ||
        jumping
    )
        return;

    jumping=true;

    velocityY=.22;

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        )
            moveLeft();


        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        )
            moveRight();


        if(
            e.key==="ArrowUp" ||
            e.key===" "
        )
            jump();

    }
);


/* =========================
   SWIPE
========================= */

let startX=0;

let startY=0;


document.addEventListener(
    "touchstart",
    e=>{

        startX=
        e.changedTouches[0].clientX;

        startY=
        e.changedTouches[0].clientY;

    },
    {passive:true}
);


document.addEventListener(
    "touchend",
    e=>{

        if(!running)
            return;


        const endX=
        e.changedTouches[0].clientX;

        const endY=
        e.changedTouches[0].clientY;


        const dx=
        endX-startX;

        const dy=
        endY-startY;


        if(
            Math.abs(dx)<30 &&
            Math.abs(dy)<30
        )
            return;


        if(
            Math.abs(dx)>
            Math.abs(dy)
        ){

            if(dx>0)
                moveRight();

            else
                moveLeft();

        }else{

            if(dy<0)
                jump();

        }

    },
    {passive:true}
);


/* =========================
   COLLISION
========================= */

function collision(a,b){

    return (

        Math.abs(
            a.position.x -
            b.position.x
        ) < 1.1 &&

        Math.abs(
            a.position.y -
            b.position.y
        ) < 1.5 &&

        Math.abs(
            a.position.z -
            b.position.z
        ) < 1.2

    );

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    running=false;

    document.getElementById(
        "finalScore"
    ).innerText=
    Math.floor(score);

    document.getElementById(
        "gameOver"
    ).style.display="flex";

}


/* =========================
   GAME LOOP
========================= */

let spawnTimer=0;

function animate(){

    requestAnimationFrame(
        animate
    );


    if(running){

        /* Player lane movement */

        player.position.x +=
        (
            lanes[lane] -
            player.position.x
        )*.18;


        /* Jump */

        if(jumping){

            player.position.y +=
            velocityY;

            velocityY -= .012;


            if(
                player.position.y<=0
            ){

                player.position.y=0;

                velocityY=0;

                jumping=false;

            }

        }


        /* Speed */

        speed += .00008;

        score += .03;


        document.getElementById(
            "score"
        ).innerText=
        Math.floor(score);


        /* Road movement */

        lines.forEach(
            line=>{

                line.position.z +=
                speed;

                if(
                    line.position.z>8
                ){

                    line.position.z=
                    -190;

                }

            }
        );


        /* Spawn */

        spawnTimer += speed;


        if(
            spawnTimer>2.2
        ){

            spawnTimer=0;


            if(
                Math.random()<.55
            )

                createObstacle();

            else

                createCoin();

        }


        /* Obstacles */

        obstacles.forEach(
            (o,index)=>{

                o.position.z +=
                speed;


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    endGame();

                }


                if(
                    o.position.z>10
                ){

                    scene.remove(o);

                    obstacles.splice(
                        index,
                        1
                    );

                }

            }
        );


        /* Coins */

        coins.forEach(
            (c,index)=>{

                c.position.z +=
                speed;

                c.rotation.y +=
                .08;


                if(
                    collision(
                        player,
                        c
                    )
                ){

                    coinCount++;

                    score += 10;


                    document.getElementById(
                        "coins"
                    ).innerText=
                    coinCount;


                    scene.remove(c);

                    coins.splice(
                        index,
                        1
                    );

                }


                if(
                    c.position.z>10
                ){

                    scene.remove(c);

                    coins.splice(
                        index,
                        1
                    );

                }

            }
        );

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* Resize */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
