<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindTest</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #293d8f, transparent 45%),
        linear-gradient(135deg, #080b18, #11162b);

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 450px;
    padding: 25px;
}

.card {
    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 25px;

    padding: 25px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);

    backdrop-filter: blur(15px);
}

h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aeb7d9;
    margin-bottom: 25px;
}

.stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    flex: 1;

    background: rgba(255,255,255,0.08);

    padding: 12px;

    border-radius: 15px;

    text-align: center;
}

.stat small {
    display: block;
    color: #aeb7d9;
    font-size: 12px;
}

.stat b {
    font-size: 20px;
}

.progress {
    height: 8px;

    background: #222943;

    border-radius: 10px;

    overflow: hidden;

    margin-bottom: 25px;
}

.progressBar {
    height: 100%;

    width: 0%;

    background: #5d7cff;

    transition: 0.3s;
}

.question {
    font-size: 21px;

    font-weight: bold;

    line-height: 1.5;

    margin-bottom: 20px;
}

.options button {
    width: 100%;

    padding: 15px;

    margin: 7px 0;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.06);

    color: white;

    font-size: 17px;

    text-align: left;

    cursor: pointer;

    transition: 0.2s;
}

.options button:hover {
    background: rgba(255,255,255,0.15);
}

.options button:active {
    transform: scale(0.98);
}

.start {
    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 15px;

    background: #5d7cff;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;
}

.result {
    text-align: center;
}

.score {
    font-size: 55px;

    font-weight: bold;

    margin: 15px;
}

.resultBox {
    background: rgba(255,255,255,0.07);

    border-radius: 15px;

    padding: 15px;

    margin: 15px 0;

    text-align: left;
}

.resultBox p {
    margin: 10px 0;
}

.hidden {
    display: none;
}

.good {
    color: #65e6a5;
}

.bad {
    color: #ff7180;
}

</style>
</head>

<body>

<div class="container">

<div class="card" id="startScreen">

<h1>🧠 MIND TEST</h1>

<p class="subtitle">
Test your logic, patterns & reasoning
</p>

<div class="resultBox">

<p>🧩 15 Questions</p>

<p>🎯 Multiple Choice</p>

<p>⏱️ Time Based</p>

<p>🏆 Get your final score</p>

</div>

<button class="start" onclick="startTest()">
START TEST
</button>

</div>


<div class="card hidden" id="testScreen">

<div class="stats">

<div class="stat">
<small>QUESTION</small>
<b id="questionNumber">1/15</b>
</div>

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>TIME</small>
<b id="time">0:00</b>
</div>

</div>

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="question" id="question">
Question
</div>

<div class="options" id="options">
</div>

</div>


<div class="card hidden result" id="resultScreen">

<h1>🏆 TEST COMPLETE</h1>

<div class="score" id="finalScore">
0/15
</div>

<p id="resultTitle">
</p>

<div class="resultBox">

<p>✅ Correct: <b id="correctAnswers">0</b></p>

<p>❌ Wrong: <b id="wrongAnswers">0</b></p>

<p>🎯 Accuracy: <b id="accuracy">0%</b></p>

<p>⏱️ Time: <b id="finalTime">0:00</b></p>

</div>

<button class="start" onclick="startTest()">
🔄 RETAKE TEST
</button>

</div>

</div>


<script>

const questions = [

{
q: "What number comes next? 2, 4, 8, 16, ?",
a: ["24", "30", "32", "36"],
c: 2
},

{
q: "What number is missing? 3, 6, 12, 24, ?",
a: ["36", "42", "48", "52"],
c: 2
},

{
q: "If all BLOPS are ZIPS, and all ZIPS are TAPS, are all BLOPS TAPS?",
a: ["Yes", "No", "Impossible", "Only sometimes"],
c: 0
},

{
q: "Which one is different?",
a: ["Circle", "Triangle", "Square", "Rectangle"],
c: 0
},

{
q: "What comes next? 1, 1, 2, 3, 5, 8, ?",
a: ["11", "12", "13", "15"],
c: 2
},

{
q: "A clock shows 3:00. What is the angle between the hands?",
a: ["45°", "90°", "120°", "180°"],
c: 1
},

{
q: "Which number does NOT belong? 2, 4, 8, 16, 31, 32",
a: ["8", "16", "31", "32"],
c: 2
},

{
q: "If CAT = 3 letters, DOG = 3 letters, ELEPHANT = ?",
a: ["6", "7", "8", "9"],
c: 2
},

{
q: "What comes next? 100, 90, 70, 40, ?",
a: ["20", "10", "0", "-10"],
c: 2
},

{
q: "You have 3 boxes. One contains a prize. You choose box 2. Someone tells you box 1 is empty. Should you switch to box 3?",
a: ["Always", "Never", "It makes no difference", "Cannot tell"],
c: 2
},

{
q: "Which pattern comes next? ▲ ▲ ● ▲ ▲ ● ▲ ▲ ?",
a: ["▲", "●", "■", "◆"],
c: 1
},

{
q: "If you rearrange the letters in 'LISTEN', you can make:",
a: ["SILENT", "LITTLE", "LINE", "STONE"],
c: 0
},

{
q: "What number comes next? 5, 10, 20, 40, ?",
a: ["60", "70", "80", "100"],
c: 2
},

{
q: "A person walks north, then turns right, then right again. Which direction are they facing?",
a: ["North", "South", "East", "West"],
c: 1
},

{
q: "Which number completes the pattern? 4, 9, 16, 25, ?",
a: ["30", "32", "36", "49"],
c: 2
}

];

let current = 0;
let score = 0;
let startTime = 0;
let timer;

function startTest() {

    current = 0;

    score = 0;

    startTime = Date.now();

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("testScreen")
        .classList.remove("hidden");

    document.getElementById("score")
        .innerText = "0";

    timer = setInterval(updateTime, 1000);

    showQuestion();

}

function updateTime() {

    let seconds =
        Math.floor((Date.now() - startTime) / 1000);

    let minutes =
        Math.floor(seconds / 60);

    seconds = seconds % 60;

    document.getElementById("time").innerText =
        minutes + ":" +
        String(seconds).padStart(2, "0");

}

function showQuestion() {

    let q = questions[current];

    document.getElementById("questionNumber")
        .innerText =
        (current + 1) + "/" + questions.length;

    document.getElementById("question")
        .innerText = q.q;

    document.getElementById("progressBar")
        .style.width =
        ((current) / questions.length * 100) + "%";

    let options =
        document.getElementById("options");

    options.innerHTML = "";

    q.a.forEach((answer, index) => {

        let button =
            document.createElement("button");

        button.innerText =
            String.fromCharCode(65 + index) +
            ". " +
            answer;

        button.onclick = function() {

            chooseAnswer(index);

        };

        options.appendChild(button);

    });

}

function chooseAnswer(index) {

    if (index === questions[current].c) {

        score++;

        document.getElementById("score")
            .innerText = score;

    }

    current++;

    if (current >= questions.length) {

        finishTest();

    } else {

        showQuestion();

    }

}

function finishTest() {

    clearInterval(timer);

    let totalSeconds =
        Math.floor((Date.now() - startTime) / 1000);

    let minutes =
        Math.floor(totalSeconds / 60);

    let seconds =
        totalSeconds % 60;

    let correct = score;

    let wrong =
        questions.length - correct;

    let accuracy =
        Math.round(
            correct / questions.length * 100
        );

    document.getElementById("testScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .innerText =
        correct + "/" + questions.length;

    document.getElementById("correctAnswers")
        .innerText = correct;

    document.getElementById("wrongAnswers")
        .innerText = wrong;

    document.getElementById("accuracy")
        .innerText = accuracy + "%";

    document.getElementById("finalTime")
        .innerText =
        minutes + ":" +
        String(seconds).padStart(2, "0");

    let title =
        document.getElementById("resultTitle");

    if (accuracy >= 90) {

        title.innerText =
            "🔥 Excellent reasoning!";

    } else if (accuracy >= 70) {

        title.innerText =
            "👏 Great job!";

    } else if (accuracy >= 50) {

        title.innerText =
            "👍 Good attempt!";

    } else {

        title.innerText =
            "🧠 Keep practicing your reasoning!";

    }

}

</script>

</body>
</html>
