<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>3D Runner</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;

    background: #07101f;

    font-family: Arial, sans-serif;

    color: white;

    touch-action: none;
}

canvas {
    display: block;
}

#ui {
    position: fixed;

    top: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-between;

    z-index: 5;

    pointer-events: none;
}

.box {
    background: rgba(0,0,0,.5);

    padding: 10px 15px;

    border-radius: 13px;

    font-weight: bold;

    backdrop-filter: blur(8px);
}

#start,
#gameOver {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
    rgba(5,10,25,.85);

    z-index: 10;
}

#gameOver {
    display: none;
}

#start h1,
#gameOver h1 {

    font-size: 44px;

    margin: 0 0 10px;
}

#start p,
#gameOver p {

    color: #aeb7d9;

    line-height: 1.6;
}

button {

    border: none;

    border-radius: 15px;

    padding: 15px 35px;

    background: #5d7cff;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

.home {

    margin-top: 10px;

    background: #202945;
}

.hint {

    position: fixed;

    bottom: 18px;

    left: 0;
    right: 0;

    text-align: center;

    color:
    rgba(255,255,255,.5);

    font-size: 13px;

    pointer-events: none;
}

</style>

</head>

<body>


<!-- SCORE -->

<div id="ui">

<div class="box">

🏆 SCORE:
<span id="score">0</span>

</div>

<div class="box">

🪙 COINS:
<span id="coins">0</span>

</div>

</div>


<!-- START -->

<div id="start">

<h1>🏃 3D RUNNER</h1>

<p>

Swipe ← → to change lane<br>

Swipe ↑ to jump<br>

Avoid obstacles & collect coins

</p>

<button onclick="startGame()">

▶ PLAY

</button>

</div>


<!-- GAME OVER -->

<div id="gameOver">

<h1>💥 GAME OVER</h1>

<p>

Score:
<b id="finalScore">0</b>

<br>

Coins:
<b id="finalCoins">0</b>

</p>

<button onclick="startGame()">

🔄 PLAY AGAIN

</button>

<button
class="home"
onclick="location.href='index.html'">

🏠 HOME

</button>

</div>


<div class="hint">

👆 SWIPE TO MOVE

</div>


<script src=
"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>


<script>


/* =========================
   SCENE
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x07101f);

scene.fog =
new THREE.Fog(
    0x07101f,
    18,
    90
);


/* =========================
   CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    .1,
    200
);

camera.position.set(
    0,
    4.2,
    8
);

camera.lookAt(
    0,
    1,
    -15
);


/* =========================
   RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.5
    )
);

document.body.appendChild(
    renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        .8
    )
);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    1
);

sun.position.set(
    5,
    10,
    5
);

scene.add(sun);


/* =========================
   ROAD
========================= */

const road =
new THREE.Mesh(

    new THREE.BoxGeometry(
        12,
        .2,
        220
    ),

    new THREE.MeshStandardMaterial({
        color: 0x242b3d
    })

);

road.position.set(
    0,
    -.1,
    -100
);

scene.add(road);


/* =========================
   LANE LINES
========================= */

const laneLines = [];


for (
    let z = -5;
    z > -210;
    z -= 8
) {

    for (
        let x of [-2, 2]
    ) {

        const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .08,
                .03,
                3
            ),

            new THREE.MeshBasicMaterial({
                color: 0x66708c
            })

        );

        line.position.set(
            x,
            .03,
            z
        );

        scene.add(line);

        laneLines.push(line);
    }
}


/* =========================
   PLAYER
========================= */

const player =
new THREE.Group();


/* Body */

const body =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .8,
        1.25,
        .7
    ),

    new THREE.MeshStandardMaterial({
        color: 0x5d7cff
    })

);

body.position.y =
.8;

player.add(body);


/* Head */

const head =
new THREE.Mesh(

    new THREE.SphereGeometry(
        .38,
        16,
        16
    ),

    new THREE.MeshStandardMaterial({
        color: 0xffd2a6
    })

);

head.position.y =
1.7;

player.add(head);


/* Legs */

const leg1 =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .22,
        .65,
        .25
    ),

    new THREE.MeshStandardMaterial({
        color: 0x333b55
    })

);

leg1.position.set(
    -.22,
    .2,
    0
);

player.add(leg1);


const leg2 =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .22,
        .65,
        .25
    ),

    new THREE.MeshStandardMaterial({
        color: 0x333b55
    })

);

leg2.position.set(
    .22,
    .2,
    0
);

player.add(leg2);


/*
   Keep player in front
   of the camera.
*/

player.position.set(
    0,
    0,
    3
);

scene.add(player);


/* =========================
   GAME VARIABLES
========================= */

const lanes = [
    -3,
    0,
    3
];

let lane = 1;

let targetX = 0;

let jumping = false;

let velocityY = 0;

let running = false;

let score = 0;

let coinCount = 0;


/*
   Start slow.
   It increases gradually.
*/

let speed = 0.22;

let spawnTimer = 0;


/*
   Minimum distance between
   obstacles.
*/

let lastObstacleZ = -70;


/* Arrays */

let obstacles = [];

let coins = [];


/* =========================
   START GAME
========================= */

function startGame() {

    obstacles.forEach(
        object =>
        scene.remove(object)
    );

    coins.forEach(
        object =>
        scene.remove(object)
    );


    obstacles = [];

    coins = [];


    lane = 1;

    targetX = 0;


    player.position.x = 0;

    player.position.y = 0;

    velocityY = 0;

    jumping = false;


    score = 0;

    coinCount = 0;


    speed = .22;

    spawnTimer = 0;

    lastObstacleZ = -70;


    document.getElementById(
        "score"
    ).innerText = "0";


    document.getElementById(
        "coins"
    ).innerText = "0";


    document.getElementById(
        "start"
    ).style.display = "none";


    document.getElementById(
        "gameOver"
    ).style.display = "none";


    running = true;

}


/* =========================
   OBSTACLE
========================= */

function createObstacle() {

    const obstacle =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.45,
            1.5,
            1.2
        ),

        new THREE.MeshStandardMaterial({
            color: 0xe94b5f
        })

    );


    const randomLane =
    Math.floor(
        Math.random() * 3
    );


    obstacle.position.set(

        lanes[randomLane],

        .75,

        -75

    );


    scene.add(obstacle);

    obstacles.push(obstacle);


    lastObstacleZ =
    -75;

}


/* =========================
   COIN
========================= */

function createCoin() {

    const coin =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .35,
            .35,
            .12,
            16
        ),

        new THREE.MeshStandardMaterial({
            color: 0xffd83d
        })

    );


    const randomLane =
    Math.floor(
        Math.random() * 3
    );


    coin.position.set(

        lanes[randomLane],

        1.2,

        -75

    );


    coin.rotation.x =
    Math.PI / 2;


    scene.add(coin);

    coins.push(coin);

}


/* =========================
   MOVEMENT
========================= */

function moveLeft() {

    if (!running)
        return;


    lane--;

    if (lane < 0)
        lane = 0;


    targetX =
    lanes[lane];

}


function moveRight() {

    if (!running)
        return;


    lane++;

    if (lane > 2)
        lane = 2;


    targetX =
    lanes[lane];

}


function jump() {

    if (
        !running ||
        jumping
    )
        return;


    jumping = true;

    velocityY = .23;

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        )
            moveLeft();


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        )
            moveRight();


        if (
            event.key === "ArrowUp" ||
            event.key === " "
        )
            jump();

    }
);


/* =========================
   SWIPE
========================= */

let touchX = 0;

let touchY = 0;


document.addEventListener(
    "touchstart",
    event => {

        touchX =
        event.changedTouches[0].clientX;

        touchY =
        event.changedTouches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    event => {

        if (!running)
            return;


        const endX =
        event.changedTouches[0].clientX;

        const endY =
        event.changedTouches[0].clientY;


        const dx =
        endX - touchX;

        const dy =
        endY - touchY;


        if (
            Math.abs(dx) < 30 &&
            Math.abs(dy) < 30
        )
            return;


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0)
                moveRight();

            else
                moveLeft();

        }

        else {

            if (dy < 0)
                jump();

        }

    },
    {
        passive: true
    }
);


/* =========================
   COLLISION
========================= */

function hitObstacle(
    object
) {

    const dx =
    Math.abs(
        player.position.x -
        object.position.x
    );

    const dy =
    Math.abs(
        player.position.y -
        object.position.y
    );

    const dz =
    Math.abs(
        player.position.z -
        object.position.z
    );


    return (
        dx < 1.05 &&
        dy < 1.35 &&
        dz < 1.1
    );

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    running = false;


    document.getElementById(
        "finalScore"
    ).innerText =
    Math.floor(score);


    document.getElementById(
        "finalCoins"
    ).innerText =
    coinCount;


    document.getElementById(
        "gameOver"
    ).style.display = "flex";

}


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (running) {


        /* Smooth lane movement */

        player.position.x +=
        (
            targetX -
            player.position.x
        ) * .15;


        /* Jump */

        if (jumping) {

            player.position.y +=
            velocityY;

            velocityY -= .012;


            if (
                player.position.y <= 0
            ) {

                player.position.y = 0;

                velocityY = 0;

                jumping = false;

            }

        }


        /* Gradually increase speed */

        speed += .000035;


        score += .025;


        document.getElementById(
            "score"
        ).innerText =
        Math.floor(score);


        /* Road */

        laneLines.forEach(
            line => {

                line.position.z +=
                speed;


                if (
                    line.position.z > 10
                ) {

                    line.position.z =
                    -210;

                }

            }
        );


        /*
           Spawn every ~2.5 seconds
           at beginning.
        */

        spawnTimer += speed;


        if (
            spawnTimer >= 3.8
        ) {

            spawnTimer = 0;


            /*
               Mostly obstacles,
               sometimes coins.
            */

            if (
                Math.random() < .65
            )

                createObstacle();

            else

                createCoin();

        }


        /* Obstacles */

        for (
            let i =
            obstacles.length - 1;

            i >= 0;

            i--
        ) {

            const obstacle =
            obstacles[i];


            obstacle.position.z +=
            speed;


            if (
                hitObstacle(obstacle)
            ) {

                gameOver();

                break;

            }


            if (
                obstacle.position.z > 12
            ) {

                scene.remove(
                    obstacle
                );

                obstacles.splice(
                    i,
                    1
                );

            }

        }


        /* Coins */

        for (
            let i =
            coins.length - 1;

            i >= 0;

            i--
        ) {

            const coin =
            coins[i];


            coin.position.z +=
            speed;


            coin.rotation.y +=
            .08;


            if (
                hitObstacle(coin)
            ) {

                coinCount++;

                score += 10;


                document.getElementById(
                    "coins"
                ).innerText =
                coinCount;


                scene.remove(
                    coin
                );

                coins.splice(
                    i,
                    1
                );

                continue;

            }


            if (
                coin.position.z > 12
            ) {

                scene.remove(
                    coin
                );

                coins.splice(
                    i,
                    1
                );

            }

        }

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        innerWidth /
        innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
