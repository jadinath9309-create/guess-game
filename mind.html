<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindTest</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #293d8f, transparent 45%),
        linear-gradient(135deg, #080b18, #11162b);

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 450px;
    padding: 25px;
}

.card {
    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 25px;

    padding: 25px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);

    backdrop-filter: blur(15px);
}

h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aeb7d9;
    margin-bottom: 25px;
}

.stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    flex: 1;

    background: rgba(255,255,255,0.08);

    padding: 12px;

    border-radius: 15px;

    text-align: center;
}

.stat small {
    display: block;
    color: #aeb7d9;
    font-size: 12px;
}

.stat b {
    font-size: 20px;
}

.progress {
    height: 8px;

    background: #222943;

    border-radius: 10px;

    overflow: hidden;

    margin-bottom: 25px;
}

.progressBar {
    height: 100%;

    width: 0%;

    background: #5d7cff;

    transition: 0.3s;
}

.question {
    font-size: 21px;

    font-weight: bold;

    line-height: 1.5;

    margin-bottom: 20px;
}

.options button {
    width: 100%;

    padding: 15px;

    margin: 7px 0;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.06);

    color: white;

    font-size: 17px;

    text-align: left;

    cursor: pointer;

    transition: 0.2s;
}

.options button:hover {
    background: rgba(255,255,255,0.15);
}

.options button:active {
    transform: scale(0.98);
}

.start {
    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 15px;

    background: #5d7cff;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;
}

.result {
    text-align: center;
}

.score {
    font-size: 55px;

    font-weight: bold;

    margin: 15px;
}

.resultBox {
    background: rgba(255,255,255,0.07);

    border-radius: 15px;

    padding: 15px;

    margin: 15px 0;

    text-align: left;
}

.resultBox p {
    margin: 10px 0;
}

.hidden {
    display: none;
}

.good {
    color: #65e6a5;
}

.bad {
    color: #ff7180;
}

</style>
</head>

<body>

<div class="container">

<div class="card" id="startScreen">

<h1>🧠 MIND TEST</h1>

<p class="subtitle">
Test your logic, patterns & reasoning
</p>

<div class="resultBox">

<p>🧩 15 Questions</p>

<p>🎯 Multiple Choice</p>

<p>⏱️ Time Based</p>

<p>🏆 Get your final score</p>

</div>

<button class="start" onclick="startTest()">
START TEST
</button>

</div>


<div class="card hidden" id="testScreen">

<div class="stats">

<div class="stat">
<small>QUESTION</small>
<b id="questionNumber">1/15</b>
</div>

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>TIME</small>
<b id="time">0:00</b>
</div>

</div>

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="question" id="question">
Question
</div>

<div class="options" id="options">
</div>

</div>


<div class="card hidden result" id="resultScreen">

<h1>🏆 TEST COMPLETE</h1>

<div class="score" id="finalScore">
0/15
</div>

<p id="resultTitle">
</p>

<div class="resultBox">

<p>✅ Correct: <b id="correctAnswers">0</b></p>

<p>❌ Wrong: <b id="wrongAnswers">0</b></p>

<p>🎯 Accuracy: <b id="accuracy">0%</b></p>

<p>⏱️ Time: <b id="finalTime">0:00</b></p>

</div>

<button class="start" onclick="startTest()">
🔄 RETAKE TEST
</button>

</div>

</div>


<script>

const questions = [

{
q: "7 + 8 = ?",
a: ["14", "15", "16", "17"],
c: 1
},

{
q: "20 - 7 = ?",
a: ["11", "12", "13", "14"],
c: 2
},

{
q: "6 × 4 = ?",
a: ["20", "24", "28", "30"],
c: 1
},

{
q: "36 ÷ 6 = ?",
a: ["5", "6", "7", "8"],
c: 1
},

{
q: "12 + 15 = ?",
a: ["25", "26", "27", "28"],
c: 2
},

{
q: "50 - 23 = ?",
a: ["25", "27", "29", "30"],
c: 1
},

{
q: "9 × 7 = ?",
a: ["54", "63", "72", "81"],
c: 1
},

{
q: "81 ÷ 9 = ?",
a: ["7", "8", "9", "10"],
c: 2
},

{
q: "5, 10, 15, 20, ?",
a: ["22", "24", "25", "30"],
c: 2
},

{
q: "2, 4, 8, 16, ?",
a: ["24", "30", "32", "36"],
c: 2
},

{
q: "100 ka 25% kitna hai?",
a: ["20", "25", "30", "40"],
c: 1
},

{
q: "10 + 5 × 2 = ?",
a: ["20", "25", "30", "15"],
c: 0
},

{
q: "45 + 15 - 20 = ?",
a: ["30", "35", "40", "45"],
c: 2
},

{
q: "8 × 8 - 10 = ?",
a: ["44", "54", "64", "74"],
c: 2
},

{
q: "120 ÷ 10 + 5 = ?",
a: ["15", "17", "20", "25"],
c: 0
},

{
q: "3, 6, 12, 24, ?",
a: ["36", "42", "48", "54"],
c: 2
},

{
q: "Ek number me 15 add karne par 40 milta hai. Number kya hai?",
a: ["20", "25", "30", "35"],
c: 1
},

{
q: "5 apples ki price ₹50 hai. 1 apple ki price kitni hai?",
a: ["₹5", "₹10", "₹15", "₹20"],
c: 1
},

{
q: "Ek box me 24 chocolates hain. 6 chocolates nikal di. Kitni bachengi?",
a: ["16", "18", "20", "22"],
c: 1
},

{
q: "15 × 2 + 10 = ?",
a: ["30", "35", "40", "45"],
c: 2
}

];
let current = 0;
let score = 0;
let startTime = 0;
let timer;

function startTest() {

    current = 0;

    score = 0;

    startTime = Date.now();

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("testScreen")
        .classList.remove("hidden");

    document.getElementById("score")
        .innerText = "0";

    timer = setInterval(updateTime, 1000);

    showQuestion();

}

function updateTime() {

    let seconds =
        Math.floor((Date.now() - startTime) / 1000);

    let minutes =
        Math.floor(seconds / 60);

    seconds = seconds % 60;

    document.getElementById("time").innerText =
        minutes + ":" +
        String(seconds).padStart(2, "0");

}

function showQuestion() {

    let q = questions[current];

    document.getElementById("questionNumber")
        .innerText =
        (current + 1) + "/" + questions.length;

    document.getElementById("question")
        .innerText = q.q;

    document.getElementById("progressBar")
        .style.width =
        ((current) / questions.length * 100) + "%";

    let options =
        document.getElementById("options");

    options.innerHTML = "";

    q.a.forEach((answer, index) => {

        let button =
            document.createElement("button");

        button.innerText =
            String.fromCharCode(65 + index) +
            ". " +
            answer;

        button.onclick = function() {

            chooseAnswer(index);

        };

        options.appendChild(button);

    });

}

function chooseAnswer(index) {

    if (index === questions[current].c) {

        score++;

        document.getElementById("score")
            .innerText = score;

    }

    current++;

    if (current >= questions.length) {

        finishTest();

    } else {

        showQuestion();

    }

}

function finishTest() {

    clearInterval(timer);

    let totalSeconds =
        Math.floor((Date.now() - startTime) / 1000);

    let minutes =
        Math.floor(totalSeconds / 60);

    let seconds =
        totalSeconds % 60;

    let correct = score;

    let wrong =
        questions.length - correct;

    let accuracy =
        Math.round(
            correct / questions.length * 100
        );

    document.getElementById("testScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .innerText =
        correct + "/" + questions.length;

    document.getElementById("correctAnswers")
        .innerText = correct;

    document.getElementById("wrongAnswers")
        .innerText = wrong;

    document.getElementById("accuracy")
        .innerText = accuracy + "%";

    document.getElementById("finalTime")
        .innerText =
        minutes + ":" +
        String(seconds).padStart(2, "0");

    let title =
        document.getElementById("resultTitle");

    if (accuracy >= 90) {

        title.innerText =
            "🔥 Excellent reasoning!";

    } else if (accuracy >= 70) {

        title.innerText =
            "👏 Great job!";

    } else if (accuracy >= 50) {

        title.innerText =
            "👍 Good attempt!";

    } else {

        title.innerText =
            "🧠 Keep practicing your reasoning!";

    }

}

</script>

</body>
</html>
