<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #263b80, transparent 45%),
        #080b18;

    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 94%;
    max-width: 460px;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
    font-size: 34px;
}

.subtitle {
    color: #aeb7d9;
    margin-top: 0;
}

/* Difficulty */

.modes {
    display: flex;
    gap: 8px;
    margin: 18px 0;
}

.mode {
    flex: 1;

    padding: 11px 5px;

    border: none;
    border-radius: 12px;

    background: #171e36;
    color: #aeb7d9;

    font-weight: bold;
    cursor: pointer;
}

.mode.active {
    background: #5d7cff;
    color: white;
}

/* Score */

.scoreBox {
    display: flex;
    justify-content: space-between;

    background: #151b32;

    padding: 13px 20px;

    border-radius: 15px;

    margin-bottom: 15px;
}

.scoreBox span {
    color: #9da6c7;
    font-size: 13px;
}

.scoreBox b {
    font-size: 21px;
}

/* Game */

canvas {
    width: 100%;
    max-width: 440px;

    aspect-ratio: 1 / 1;

    background: #111827;

    border: 4px solid #303b63;

    border-radius: 15px;

    display: block;
    margin: auto;

    image-rendering: auto;

    touch-action: none;
}

/* Message */

.message {
    min-height: 25px;

    margin: 12px;

    font-weight: bold;
}

/* Controls */

.controls {
    margin: 15px auto;

    width: 220px;

    display: grid;

    grid-template-columns: repeat(3, 68px);
    grid-template-rows: repeat(2, 58px);

    gap: 7px;

    justify-content: center;
}

.controls button {
    border: none;

    border-radius: 13px;

    background: #202945;

    color: white;

    font-size: 23px;

    cursor: pointer;

    touch-action: manipulation;
}

.controls button:active {
    transform: scale(0.92);
    background: #303b63;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

/* Bottom buttons */

.actions {
    display: flex;
    gap: 10px;
}

.actions button {
    flex: 1;

    padding: 14px;

    border: none;
    border-radius: 13px;

    background: #5d7cff;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.actions .home {
    background: #202945;
}

</style>

</head>

<body>

<div class="game">

<h1>🐍 SNAKE</h1>

<p class="subtitle">
Choose difficulty and beat your best score!
</p>


<!-- Difficulty -->

<div class="modes">

<button class="mode active"
onclick="setMode('easy', this)">
EASY
</button>

<button class="mode"
onclick="setMode('normal', this)">
NORMAL
</button>

<button class="mode"
onclick="setMode('hard', this)">
HARD
</button>

</div>


<!-- Score -->

<div class="scoreBox">

<div>
<span>SCORE</span><br>
<b id="score">0</b>
</div>

<div>
<span>BEST</span><br>
<b id="best">0</b>
</div>

</div>


<!-- Bigger map -->

<canvas
id="game"
width="440"
height="440">
</canvas>


<div class="message" id="message">
Choose a direction!
</div>


<!-- Mobile controls -->

<div class="controls">

<button class="up"
onclick="changeDirection('up')">
⬆️
</button>

<button class="left"
onclick="changeDirection('left')">
⬅️
</button>

<button class="down"
onclick="changeDirection('down')">
⬇️
</button>

<button class="right"
onclick="changeDirection('right')">
➡️
</button>

</div>


<div class="actions">

<button onclick="restartGame()">
🔄 RESTART
</button>

<button class="home"
onclick="location.href='index.html'">
🏠 HOME
</button>

</div>

</div>


<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


/*
   Bigger map:
   Old = 20 × 20
   New = 22 × 22
*/

const grid = 20;

const tileCount = 22;


let snake = [];

let apple = {};

let direction = "right";

let nextDirection = "right";

let score = 0;

let gameOver = false;

let gameLoop;


/*
   Difficulty speeds.

   Easy   = 180ms
   Normal = 130ms
   Hard   = 90ms
*/

const speeds = {

    easy: 180,

    normal: 130,

    hard: 90

};

let mode = "easy";

let best =
Number(localStorage.getItem("snakeBest")) || 0;

document.getElementById("best")
.innerText = best;


/* Set difficulty */

function setMode(newMode, button) {

    mode = newMode;

    document
    .querySelectorAll(".mode")
    .forEach(
        b => b.classList.remove("active")
    );

    button.classList.add("active");

    restartGame();

}


/* Start */

function startGame() {

    snake = [

        {x: 11, y: 11},

        {x: 10, y: 11},

        {x: 9, y: 11}

    ];


    direction = "right";

    nextDirection = "right";

    score = 0;

    gameOver = false;


    document.getElementById("score")
    .innerText = score;


    document.getElementById("message")
    .innerText =
    "Eat 🍎 and grow!";


    createApple();


    clearInterval(gameLoop);


    gameLoop = setInterval(
        update,
        speeds[mode]
    );


    draw();

}


/* Apple */

function createApple() {

    do {

        apple = {

            x:
            Math.floor(
                Math.random() * tileCount
            ),

            y:
            Math.floor(
                Math.random() * tileCount
            )

        };

    } while (

        snake.some(
            part =>
            part.x === apple.x &&
            part.y === apple.y
        )

    );

}


/* Game update */

function update() {

    if (gameOver) return;


    direction = nextDirection;


    let head = {

        x: snake[0].x,

        y: snake[0].y

    };


    if (direction === "up")
        head.y--;

    if (direction === "down")
        head.y++;

    if (direction === "left")
        head.x--;

    if (direction === "right")
        head.x++;


    /* Wall */

    if (

        head.x < 0 ||

        head.x >= tileCount ||

        head.y < 0 ||

        head.y >= tileCount

    ) {

        endGame();

        return;

    }


    /* Self */

    if (

        snake.some(
            part =>
            part.x === head.x &&
            part.y === head.y
        )

    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* Apple */

    if (

        head.x === apple.x &&

        head.y === apple.y

    ) {

        score++;


        document.getElementById("score")
        .innerText = score;


        if (score > best) {

            best = score;


            localStorage.setItem(
                "snakeBest",
                best
            );


            document.getElementById("best")
            .innerText = best;

        }


        createApple();

    }

    else {

        snake.pop();

    }


    draw();

}


/* Draw */

function draw() {

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Grid */

    ctx.strokeStyle =
    "rgba(255,255,255,0.035)";


    for (
        let i = 0;
        i <= canvas.width;
        i += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(i, 0);

        ctx.lineTo(i, canvas.height);

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0, i);

        ctx.lineTo(canvas.width, i);

        ctx.stroke();

    }


    /* Apple */

    ctx.font = "18px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";


    ctx.fillText(

        "🍎",

        apple.x * grid + grid / 2,

        apple.y * grid + grid / 2

    );


    /* Snake */

    snake.forEach(

        (part, index) => {

            ctx.fillStyle =
            index === 0
            ? "#7189ff"
            : "#5069cf";


            ctx.fillRect(

                part.x * grid + 1,

                part.y * grid + 1,

                grid - 2,

                grid - 2

            );

        }

    );

}


/* Direction */

function changeDirection(newDirection) {

    if (gameOver) return;


    if (

        newDirection === "up" &&

        direction !== "down"

    )

        nextDirection = "up";


    if (

        newDirection === "down" &&

        direction !== "up"

    )

        nextDirection = "down";


    if (

        newDirection === "left" &&

        direction !== "right"

    )

        nextDirection = "left";


    if (

        newDirection === "right" &&

        direction !== "left"

    )

        nextDirection = "right";

}


/* Keyboard */

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ) {

            changeDirection("up");

        }


        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {

            changeDirection("down");

        }


        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            changeDirection("left");

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            changeDirection("right");

        }

    }

);


/* Game over */

function endGame() {

    gameOver = true;

    clearInterval(gameLoop);


    document.getElementById("message")
    .innerText =
    "💥 GAME OVER! Score: " + score;

}


/* Restart */

function restartGame() {

    startGame();

}


startGame();

</script>

</body>
</html>
